<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e4f44" />
    <title>厦门麻将 · 金牌桌</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p id="ai-profile-note" class="eyebrow">LOCAL TABLE · TEACHER PLAY</p>
          <h1>厦门麻将 <span>金牌桌</span></h1>
        </div>
        <div class="table-controls">
          <label class="profile-picker" for="table-mode">牌桌模式
            <select id="table-mode" aria-label="选择牌桌模式"></select>
          </label>
          <label class="profile-picker" for="rules-profile">规则档位
            <select id="rules-profile" aria-label="选择规则档位"></select>
          </label>
          <label class="profile-picker" for="ai-delay">AI 出牌间隔
            <select id="ai-delay" aria-label="选择 AI 出牌间隔"></select>
          </label>
          <a class="guide-link" href="/guide.html">规则与胡牌教学</a>
          <button id="toggle-debug" class="debug-button" type="button" aria-pressed="false">显示 AI 手牌（调试）</button>
          <button id="reset-match" class="secondary-button danger-button" type="button">重置积分</button>
          <button id="new-game" class="primary-button" type="button">新开一局</button>
        </div>
      </header>

      <section id="action-panel" class="action-panel" aria-label="可执行操作">
        <p>等待你的回合…</p>
      </section>

      <section class="game-layout" aria-live="polite">
        <aside class="info-panel">
          <div class="status-card">
            <p class="section-kicker">牌局状态</p>
            <strong id="message">正在发牌…</strong>
            <p id="turn-detail" class="muted"></p>
            <p id="recording-note" class="muted"></p>
          </div>
          <div class="gold-card">
            <p class="section-kicker">翻金</p>
            <div class="gold-tiles">
              <div><small id="gold-indicator-label">指示牌</small><span id="gold-indicator" class="tile-slot">?</span></div>
              <div><small>金牌</small><span id="gold-tile" class="tile-slot">?</span></div>
            </div>
            <p id="gold-proxy-note" class="gold-proxy-note"></p>
          </div>
          <div class="status-card split-stat">
            <div><small>剩余牌墙</small><strong id="wall-count">–</strong></div>
            <div><small>回合</small><strong id="turn-count">–</strong></div>
            <div><small>局数</small><strong id="hand-number">–</strong></div>
            <div><small>连庄</small><strong id="dealer-streak">–</strong></div>
          </div>
          <details class="rules-card">
            <summary>本局规则</summary>
            <ul id="rules-list"></ul>
          </details>
        </aside>

        <section class="table-wrap" aria-label="麻将桌">
          <div class="mahjong-table">
            <span id="debug-ribbon" class="debug-ribbon">AI 手牌已明牌 · 调试</span>
            <section class="seat seat-top" data-seat="2"></section>
            <section class="seat seat-left" data-seat="3"></section>
            <section class="seat seat-right" data-seat="1"></section>
            <section class="seat seat-bottom" data-seat="0"></section>
            <section class="river river-top" data-river="2" aria-label="对家弃牌区"></section>
            <section class="river river-left" data-river="3" aria-label="左家弃牌区"></section>
            <section class="river river-right" data-river="1" aria-label="右家弃牌区"></section>
            <section class="river river-bottom" data-river="0" aria-label="你的弃牌区"></section>
            <div class="table-center">
              <span class="compass">厦<br />门<br />麻<br />将</span>
              <span id="phase-chip" class="phase-chip">准备</span>
              <span id="special-state" class="special-state hidden"></span>
            </div>
          </div>
        </section>

        <aside class="event-panel">
          <div class="event-heading"><p class="section-kicker">牌局记录</p><small>最新在上</small></div>
          <ol id="event-list"></ol>
        </aside>
      </section>

      <section id="result-card" class="result-card hidden"></section>
    </main>
    <template id="tile-template"><button type="button" class="tile"></button></template>
    <script src="/app.js" defer></script>
  </body>
</html>
