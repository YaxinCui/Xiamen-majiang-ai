<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e4f44" />
    <title>厦门麻将 · 金牌桌</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LOCAL TABLE · TEACHER PLAY</p>
          <h1>厦门麻将 <span>金牌桌</span></h1>
        </div>
        <button id="new-game" class="secondary-button">新开一局</button>
      </header>

      <section class="game-layout" aria-live="polite">
        <aside class="info-panel">
          <div class="status-card">
            <p class="section-kicker">牌局状态</p>
            <strong id="message">正在发牌…</strong>
            <p id="turn-detail" class="muted"></p>
          </div>
          <div class="gold-card">
            <p class="section-kicker">翻金</p>
            <div class="gold-tiles">
              <div><small>指示牌</small><span id="gold-indicator" class="tile compact">?</span></div>
              <div><small>金牌</small><span id="gold-tile" class="tile compact gold">?</span></div>
            </div>
          </div>
          <div class="status-card split-stat">
            <div><small>剩余牌墙</small><strong id="wall-count">–</strong></div>
            <div><small>回合</small><strong id="turn-count">–</strong></div>
          </div>
          <details class="rules-card">
            <summary>本局规则</summary>
            <ul id="rules-list"></ul>
          </details>
        </aside>

        <section class="table-wrap" aria-label="麻将桌">
          <div class="mahjong-table">
            <section class="seat seat-top" data-seat="2"></section>
            <section class="seat seat-left" data-seat="3"></section>
            <section class="seat seat-right" data-seat="1"></section>
            <section class="seat seat-bottom" data-seat="0"></section>
            <div class="table-center">
              <span class="compass">厦<br />门<br />麻<br />将</span>
              <span id="phase-chip" class="phase-chip">准备</span>
            </div>
          </div>
          <section id="action-panel" class="action-panel">
            <p>等待你的回合…</p>
          </section>
        </section>

        <aside class="event-panel">
          <p class="section-kicker">牌局记录</p>
          <ol id="event-list"></ol>
        </aside>
      </section>

      <section id="result-card" class="result-card hidden"></section>
    </main>
    <template id="tile-template"><button type="button" class="tile"></button></template>
    <script src="/app.js" defer></script>
  </body>
</html>
